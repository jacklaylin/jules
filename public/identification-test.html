<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jules · Identification test</title><link rel="stylesheet" href="/admin.css"><script src="/identification-test.js" defer></script></head>
<body><header><a class="brand" href="/admin">jules</a><a href="/wishlist">Wishlist</a></header><main><section class="login-card"><h1>Identification test</h1><p>Owner-only test using the same visual identification code as iMessage. Returned matches are saved to your wishlist; no text is sent. Sign in at <a href="/admin">admin</a> first.</p><form id="test-form"><label for="image">Image (JPEG, PNG or WebP under 3 MB)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp" required><label for="query">What should Jules find?</label><textarea id="query" maxlength="1000" required></textarea><label><input id="sharing" type="checkbox" required> Send this image to OpenAI and garment crops to SerpApi/Google Lens. Uses API credits.</label><button id="run">Run and save to my wishlist</button></form><p id="status" role="status"></p><pre id="results"></pre></section></main></body></html>
