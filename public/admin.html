<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jules admin · People</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" type="module"></script><link rel="modulepreload" href="/admin-console.js"><link rel="modulepreload" href="/design-system.js"><link rel="modulepreload" href="/brand-ui.js"><link rel="modulepreload" href="/activity.js"><link rel="modulepreload" href="/wishlist-session.js"><link rel="modulepreload" href="/admin-session.js"><link rel="modulepreload" href="/admin-review.js"><link rel="modulepreload" href="/admin-people-view.js">
<link rel="icon" href="/brand/icon.svg" type="image/svg+xml"></head>
<body class="admin-console">
  <main>
    <h1 class="dv-title">People</h1>
    <section id="chat-metrics" class="chat-metrics" aria-labelledby="chat-metrics-title" hidden>
      <div id="chat-metrics-strip" class="dv-metrics">
        <div class="dv-metric dv-metric-label"><strong id="chat-metrics-title">Chat quality</strong><span>Last 7 days vs the 7 before</span></div>
      </div>
      <details class="fold metrics-help"><summary>What these numbers mean</summary><dl id="chat-metrics-help"></dl></details>
    </section>
    <div class="dv-toolbar">
      <div id="people-access" class="seg" role="group" aria-label="Filter by waitlist status" hidden></div>
      <label class="dv-search"><span class="sr-only">Search name or number</span><input id="people-search" type="search" maxlength="40" placeholder="Search name or number"><span class="kbd" aria-hidden="true">/</span></label>
      <span id="people-count" class="dv-toolbar-note"></span>
      <span class="spacer"></span>
      <button class="small quiet" type="button" popovertarget="people-more">More ⋯</button>
    </div>
    <div id="people-more" class="dv-pop dv-menu" popover aria-label="More actions">
      <button id="refresh" type="button">Refresh <span class="hint">people and chat quality</span></button>
    </div>
    <div class="dv-status"><span id="metrics-note"></span><span id="notice" role="status" aria-live="polite"></span><span class="dv-keys" aria-hidden="true"><span class="kbd">J</span><span class="kbd">K</span> move <span class="kbd">↵</span> open</span></div>
    <div id="people" class="dv-list people-list" aria-label="People"></div>
  </main>
  <dialog id="access-dialog" class="confirm-dialog" aria-labelledby="access-title">
    <h2 id="access-title">Change waitlist status?</h2>
    <p><strong id="access-person">This person</strong></p>
    <div id="access-lines"></div>
    <p id="access-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="access-confirm" class="btn--butter" type="button">Confirm</button><button id="access-cancel" type="button">Cancel</button></div>
  </dialog>
</body>
</html>
