<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Jules</title><link rel="icon" href="/brand/icon.svg"><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/public-auth.css"><script type="module" src="/login.js"></script></head><body class="public-auth-page"><header class="app-header public-header"><a class="wordmark" href="/" aria-label="Jules home"><img src="/brand/wordmark.svg" alt="Jules" width="75" height="55"></a></header><main><section class="public-auth"><h1>Welcome back</h1><p class="intro">Log in with the number you text Jules from. We’ll text you a code.</p><form id="login-form"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="+1 (415) 555-0123" required maxlength="32"><button id="login-button" class="btn--butter" type="submit">Text me a code</button></form><form id="verify-form" hidden><label for="code">Your sign-in code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required><button id="verify-button" class="btn--butter">Log in</button><button id="change-number" type="button">Use another number</button></form><p id="login-status" role="status" aria-live="polite"></p><p class="fine">New here? <a href="/signup">Sign up to text Jules</a></p><noscript><p>Enable JavaScript to sign in.</p></noscript></section></main></body></html>
